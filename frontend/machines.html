<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GYMFIT | 헬스장 머신</title>
  <link rel="stylesheet" href="/static/css/common.css?v=2">
  <link rel="stylesheet" href="/static/css/common_layout.css?v=4">
  <link rel="stylesheet" href="/static/css/common_dropdown.css?v=3">
  <link rel="stylesheet" href="/static/css/machines.css?v=1">
  <script src="/static/js/api_client.js?v=5" defer></script>
  <script src="/static/js/common_layout.js?v=23" defer></script>
  <script src="/static/js/common_dropdown.js?v=2" defer></script>
  <script src="/static/js/machines.js?v=6" defer></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <meta name="theme-color" content="#000000">
</head>
<body data-page="machines" data-header-title="헬스장 머신">
  <main class="machines-page">
    <div class="machines-container">
      <div id="topHeaderContainer"></div>

      <section class="machine-state gymfit-state" id="machineLoading" role="status" aria-live="polite">머신 목록을 불러오는 중입니다.</section>
      <section class="machine-state gymfit-state error" id="machineError" hidden role="alert">
        <strong>머신 목록을 불러오지 못했습니다.</strong>
        <p id="machineErrorMessage"></p>
        <button type="button" id="machineRetry">다시 시도</button>
      </section>
      <section class="machine-state gymfit-state" id="gymRequired" hidden>
        <strong>등록된 헬스장이 없습니다.</strong>
        <p>내 헬스장을 먼저 등록하면 보유 머신을 확인할 수 있어요.</p>
        <a href="/my-gym">내 헬스장 등록</a>
      </section>

      <div id="machineContent" hidden>
        <section class="machine-hero">
          <div><span>GYM MACHINES</span><h2 id="machineGymName"></h2><p><b id="machineCount">0</b>개의 머신</p></div>
          <button type="button" id="machineCreateButton" hidden>머신 등록</button>
        </section>

        <section class="machine-tools">
          <label class="machine-search"><span class="sr-only">머신명 검색</span><input id="machineSearch" type="search" maxlength="100" placeholder="머신명, 브랜드, 모델 검색"></label>
          <div class="machine-filters" id="machineFilters" aria-label="운동 부위 필터"></div>
        </section>

        <section class="machine-empty" id="machineEmpty" hidden>
          <h2 id="machineEmptyTitle"></h2>
          <p id="machineEmptyDescription"></p>
          <button type="button" id="machineEmptyCreate" hidden>첫 머신 등록</button>
        </section>
        <section class="machine-grid" id="machineList" aria-live="polite"></section>
      </div>
    </div>

    <div class="sheet-overlay" id="machineDetailOverlay" hidden>
      <button class="sheet-backdrop" id="machineDetailBackdrop" type="button" aria-label="머신 상세 닫기"></button>
      <section class="machine-sheet detail-sheet" role="dialog" aria-modal="true" aria-labelledby="machineDetailTitle">
        <header><div><span>MACHINE GUIDE</span><h2 id="machineDetailTitle">머신 상세</h2></div><button class="icon-close" id="machineDetailClose" type="button" aria-label="닫기"><img src="/static/assets/icons/no.svg" alt=""></button></header>
        <div id="machineDetailBody"></div>
      </section>
    </div>

    <div class="sheet-overlay" id="machineFormOverlay" hidden>
      <button class="sheet-backdrop" id="machineFormBackdrop" type="button" aria-label="머신 입력 닫기"></button>
      <section class="machine-sheet form-sheet" role="dialog" aria-modal="true" aria-labelledby="machineFormTitle">
        <header><div><span>MACHINE EDIT</span><h2 id="machineFormTitle">머신 등록</h2></div><button class="icon-close" id="machineFormClose" type="button" aria-label="닫기"><img src="/static/assets/icons/no.svg" alt=""></button></header>
        <form id="machineForm" novalidate>
          <label>머신명 <em>필수</em><input id="machineNameInput" maxlength="120" required></label>
          <label>운동 부위 <em>필수</em><select id="machineBodyPartInput" data-gymfit-select required><option value="">운동 부위 선택</option></select></label>
          <div class="form-grid"><label>브랜드<input id="machineBrandInput" maxlength="100"></label><label>모델명<input id="machineModelInput" maxlength="120"></label></div>
          <label>설명<textarea id="machineDescriptionInput" maxlength="2000" rows="3"></textarea><small><span data-count-for="machineDescriptionInput">0</span>/2000</small></label>
          <label>사용 방법<textarea id="machineUsageInput" maxlength="5000" rows="6" placeholder="단계별 사용 방법을 입력해 주세요."></textarea><small><span data-count-for="machineUsageInput">0</span>/5000</small></label>
          <label>주의사항<textarea id="machineCautionInput" maxlength="3000" rows="4"></textarea><small><span data-count-for="machineCautionInput">0</span>/3000</small></label>
          <label>대표 이미지 <small>JPG, PNG, WebP · 최대 5MB</small><input id="machineImageInput" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></label>
          <div class="image-preview" id="machineImagePreview" hidden><img id="machineImagePreviewImg" alt="선택한 머신 이미지 미리보기"><button type="button" id="machineImageRemove">이미지 제거</button></div>
          <p class="form-message" id="machineFormMessage" role="alert" hidden></p>
          <button class="form-submit" id="machineFormSubmit" type="submit">머신 정보 저장</button>
        </form>
      </section>
    </div>

    <div class="sheet-overlay" id="machineDeleteOverlay" hidden>
      <button class="sheet-backdrop" id="machineDeleteBackdrop" type="button" aria-label="머신 삭제 닫기"></button>
      <section class="machine-sheet confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="machineDeleteTitle">
        <header><div><span>DELETE</span><h2 id="machineDeleteTitle">머신 삭제</h2></div><button class="icon-close" id="machineDeleteClose" type="button" aria-label="닫기"><img src="/static/assets/icons/no.svg" alt=""></button></header>
        <p><strong id="machineDeleteName"></strong> 머신을 목록에서 삭제할까요?<br>회원의 기존 운동 기록은 삭제되지 않습니다.</p>
        <div><button type="button" id="machineDeleteCancel">취소</button><button type="button" id="machineDeleteConfirm">삭제</button></div>
      </section>
    </div>

    <div class="machine-toast" id="machineToast" role="status" aria-live="polite" hidden></div>
    <div id="sideMenuContainer"></div>
    <div id="bottomNavigationContainer"></div>
  </main>
</body>
</html>
