<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>
    GYMFIT | 실시간 자세 코칭
  </title>

  <link
    rel="stylesheet"
    href="/static/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/common_layout.css?v=2"
  >

  <link
    rel="stylesheet"
    href="/static/css/coaching.css?v=7"
  >

  <script
    src="/static/js/common_layout.js?v=2"
    defer
  ></script>

  <script
    src="/static/js/coaching_plan.js?v=1"
    defer
  ></script>

  <script
    src="/static/js/coaching.js?v=7"
    defer
  ></script>
</head>

<body
  data-page="coaching"
  data-header-title="실시간 자세 코칭"
  data-header-subtitle="YOLO 자세 분석 · 자동 카운트"
>
  <main class="coaching-page">
    <div class="coaching-container">

      <!-- 헤더 -->
      <div id="topHeaderContainer"></div>


      <!-- 운동 선택 -->
      <section class="exercise-tabs">
        <button
          type="button"
          class="exercise-tab active"
          data-exercise-code="SQUAT"
          data-exercise-name="스쿼트"
        >
          스쿼트
        </button>

        <button
          type="button"
          class="exercise-tab"
          data-exercise-code="PUSHUP"
          data-exercise-name="푸시업"
        >
          푸시업
        </button>

        <button
          type="button"
          class="exercise-tab"
          data-exercise-code="SHOULDER_PRESS"
          data-exercise-name="숄더 프레스"
        >
          숄더 프레스
        </button>
      </section>


      <!-- 코칭 시작 설정 -->
      <section class="coaching-mode-loading" id="coachingModeLoading">
        오늘의 운동 계획을 확인하고 있습니다.
      </section>

      <section class="coaching-settings-card" id="coachingSettingsCard" hidden>
        <div class="coaching-settings-heading">
          <div>
            <span id="coachingSettingsEyebrow">FREE COACHING</span>
            <h2 id="coachingSettingsTitle">자유 코칭 설정</h2>
          </div>
          <p id="coachingSettingsMessage"></p>
        </div>

        <div class="free-coaching-settings" id="freeCoachingSettings" hidden>
          <div class="free-coaching-set-list" id="freeCoachingSetList"></div>

          <button
            type="button"
            class="free-set-add-button"
            id="freeSetAddButton"
          >
            + 세트 추가
          </button>
        </div>

        <div
          class="routine-coaching-sets"
          id="routineCoachingSets"
          hidden
        ></div>

        <fieldset class="rest-setting">
          <legend>세트 사이 휴식</legend>

          <div class="rest-preset-buttons">
            <button type="button" data-rest-seconds="0">0초</button>
            <button type="button" data-rest-seconds="30">30초</button>
            <button
              type="button"
              data-rest-seconds="60"
              class="active"
            >60초</button>
            <button type="button" data-rest-seconds="90">90초</button>
          </div>

          <label class="custom-rest-input">
            <span>직접 입력</span>
            <input
              type="number"
              id="customRestSeconds"
              min="0"
              max="300"
              inputmode="numeric"
              placeholder="0~300"
            >
            <b>초</b>
          </label>
        </fieldset>
      </section>

      <section class="set-progress-card" id="setProgressCard" hidden>
        <div>
          <span>현재 세트</span>
          <strong>
            <b id="coachingSetCurrent">1</b>
            /
            <small id="coachingSetTotal">3</small>
          </strong>
        </div>
        <div>
          <span>중량</span>
          <strong id="coachingSetWeight">맨몸</strong>
        </div>
        <p>
          전체 반복
          <b id="totalCompletedRepCount">0</b>
          /
          <span id="totalTargetRepCount">30</span>회
        </p>
        <p id="coachingPlanMeta">스쿼트 · 자유 코칭</p>
        <em id="coachingModeLabel">자유 코칭</em>
      </section>

      <section class="rest-card" id="restCard" hidden>
        <strong id="restTitle">1세트 완료</strong>
        <p>
          다음 세트까지
          <b id="restTime">01:00</b>
        </p>
        <span id="nextSetSummary"></span>
        <button type="button" id="skipRestButton">
          휴식 건너뛰기
        </button>
      </section>


      <!-- 카메라 -->
      <section class="camera-card">
        <video
          id="cameraVideo"
          autoplay
          muted
          playsinline
        ></video>

        <canvas
          id="poseCanvas"
        ></canvas>

        <div
          class="camera-placeholder"
          id="cameraPlaceholder"
        >
          <strong>카메라 준비 중</strong>

          <span>
            운동 시작 버튼을 눌러주세요.
          </span>
        </div>

        <div class="live-badge">
          <span></span>
          LIVE
        </div>

        <div class="exercise-status">
          <span>현재 동작</span>

          <strong id="movementState">
            준비
          </strong>
        </div>
      </section>


      <!-- 실시간 수치 -->
      <section class="coaching-stats">
        <article class="stat-card">
          <span>반복 횟수</span>

          <strong>
            <b id="currentRepCount">0</b>
            /
            <small id="targetRepCount">10</small>
          </strong>
        </article>

        <article class="stat-card">
          <span>세트</span>

          <strong>
            <b id="currentSetCount">0</b>
            /
            <small id="targetSetCount">3</small>
          </strong>
        </article>

        <article class="stat-card score-card">
          <span>자세 점수</span>

          <strong>
            <b id="postureScoreValue">0</b>점
          </strong>
        </article>

        <article class="stat-card">
          <span>상태</span>

          <strong
            class="status-value"
            id="postureStatus"
          >
            READY
          </strong>
        </article>
      </section>


      <!-- 피드백 -->
      <section class="feedback-card">
        <div
          class="feedback-check"
          id="feedbackIcon"
        >
          ✓
        </div>

        <div>
          <strong id="feedbackTitle">
            운동을 시작해 주세요.
          </strong>

          <p id="feedbackText">
            카메라에 전신이 보이도록 위치를 조정하세요.
          </p>
        </div>
      </section>


      <!-- 버튼 -->
      <section class="coaching-actions">
        <button
          type="button"
          class="primary-button"
          id="startButton"
        >
          운동 시작
        </button>

        <button
          type="button"
          class="secondary-button"
          id="finishButton"
          disabled
        >
          종료 및 기록 저장
        </button>
      </section>
    </div>

    <div id="sideMenuContainer"></div>

    <div
      id="bottomNavigationContainer"
    ></div>
  </main>
</body>
</html>
