<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="GYMFIT 비밀번호 찾기 페이지"
  >

  <title>GYMFIT | 비밀번호 찾기</title>

  <link
    rel="stylesheet"
    href="/static/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/find_password.css"
  >

  <script
    src="/static/js/find_password.js?v=2"
    defer
  ></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>

<body>
  <main class="find-password-page">
    <section class="find-password-container">

      <!-- 상단 -->
      <header class="page-header">
        <button
          type="button"
          class="back-button"
          id="backButton"
          aria-label="로그인 페이지로 이동"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5"></path>
            <path d="M11 18L5 12L11 6"></path>
          </svg>
        </button>
      </header>

      <!-- 이메일 입력 화면 -->
      <section
        class="password-view request-view"
        id="requestView"
      >
        <div class="visual-area">
          <div class="visual-ring">
            <div class="visual-icon">
              <svg
                viewBox="0 0 48 48"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect
                  x="12"
                  y="21"
                  width="24"
                  height="20"
                  rx="5"
                ></rect>

                <path
                  d="M17 21V16C17 12.1 20.1 9 24 9C27.9 9 31 12.1 31 16V21"
                ></path>

                <circle
                  cx="24"
                  cy="30"
                  r="2"
                ></circle>

                <path d="M24 32V35"></path>
              </svg>
            </div>

            <span class="mail-badge">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                ></rect>

                <path d="M3 7L12 13L21 7"></path>
              </svg>
            </span>
          </div>
        </div>

        <div class="title-area">
          <p class="eyebrow">ACCOUNT RECOVERY</p>

          <h1>
            비밀번호를<br>
            잊으셨나요?
          </h1>

          <p class="description">
            가입한 이메일을 입력하면<br>
            임시 비밀번호를 보내드려요.
          </p>
        </div>

        <form
          class="find-password-form"
          id="findPasswordForm"
          novalidate
        >
          <label
            class="input-label"
            for="email"
          >
            이메일
          </label>

          <div class="input-group">
            <span
              class="input-icon"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                ></rect>

                <path d="M3 7L12 13L21 7"></path>
              </svg>
            </span>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력하세요."
              autocomplete="email"
              aria-label="이메일"
            >
          </div>

          <p
            class="form-message"
            id="formMessage"
            aria-live="polite"
          ></p>

          <button
            type="submit"
            class="send-button"
            id="sendButton"
          >
            임시 비밀번호 발급
          </button>
        </form>

        <aside class="notice-card">
          <span
            class="notice-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8V12"></path>
              <path d="M12 16H12.01"></path>
            </svg>
          </span>

          <div>
            <strong>임시 비밀번호 안내</strong>

            <p>
              발급된 임시 비밀번호는 로그인 후 반드시 변경해 주세요.
            </p>
          </div>
        </aside>
      </section>

      <!-- 전송 완료 화면 -->
      <section
        class="password-view success-view"
        id="successView"
        hidden
      >
        <div class="success-visual">
          <div class="success-ring">
            <svg
              viewBox="0 0 48 48"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14 25L21 32L35 16"></path>
            </svg>
          </div>

          <span class="success-glow"></span>
        </div>

        <div class="success-title-area">
          <p class="eyebrow">EMAIL SENT</p>

          <h1>
            임시 비밀번호를<br>
            보냈어요.
          </h1>

          <p class="description">
            아래 이메일로 임시 비밀번호를 전송했습니다.
          </p>
        </div>

        <div class="email-result-card">
          <span class="email-result-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <path d="M3 7L12 13L21 7"></path>
            </svg>
          </span>

          <span
            class="email-result-text"
            id="sentEmail"
          ></span>
        </div>

        <div class="success-guide">
          <div class="guide-item">
            <span class="guide-number">1</span>
            <p>이메일에서 임시 비밀번호를 확인해 주세요.</p>
          </div>

          <div class="guide-line"></div>

          <div class="guide-item">
            <span class="guide-number">2</span>
            <p>임시 비밀번호로 로그인해 주세요.</p>
          </div>

          <div class="guide-line"></div>

          <div class="guide-item">
            <span class="guide-number">3</span>
            <p>로그인 후 새 비밀번호로 변경해 주세요.</p>
          </div>
        </div>

        <button
          type="button"
          class="login-move-button"
          id="loginMoveButton"
        >
          로그인으로 이동
        </button>

        <button
          type="button"
          class="resend-button"
          id="resendButton"
        >
          다른 이메일로 다시 발급
        </button>
      </section>

    </section>
  </main>
</body>
</html>
