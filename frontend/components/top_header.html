<header class="common-header">
  <button
    type="button"
    class="common-menu-button"
    id="menuButton"
    aria-label="메뉴 열기"
    aria-expanded="false"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="common-header-title">
    <a
      id="dashboardHeaderLogo"
      class="common-header-logo"
      href="/dashboard"
      aria-label="GYMFIT 홈"
      hidden
    >
      <img
        src="/static/assets/icons/GYMFIT-text.svg"
        alt="GYMFIT"
      >
    </a>

    <div
      id="commonHeaderText"
      class="common-header-text"
    >
      <h1 id="commonHeaderTitle"></h1>

      <p
        id="commonHeaderSubtitle"
        hidden
      ></p>
    </div>
  </div>

  <button
    type="button"
    class="common-notification-button"
    id="notificationButton"
    aria-label="알림 확인"
  >
    <img
      id="notificationIcon"
      src="/static/assets/icons/bell_off.svg"
      alt=""
    >
  </button>
</header>
