<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GYMFIT | 알림</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/common_layout.css?v=4">
  <link rel="stylesheet" href="/static/css/notifications.css?v=1">
  <script src="/static/js/api_client.js?v=3" defer></script>
  <script src="/static/js/common_layout.js?v=22" defer></script>
  <script src="/static/js/notifications.js?v=1" defer></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>
<body data-page="notifications" data-header-title="알림" data-header-subtitle="새로운 소식을 확인하세요">
  <main class="notifications-page">
    <div class="notifications-container">
      <div id="topHeaderContainer"></div>
      <div class="notifications-toolbar"><h1>알림</h1><button type="button" id="readAllButton">전체 읽음</button></div>
      <section id="notificationsLoading" class="notification-state gymfit-state" role="status" aria-live="polite">알림을 불러오고 있습니다.</section>
      <section id="notificationsError" class="notification-state gymfit-state error" hidden role="alert"><strong>알림을 불러오지 못했어요.</strong><p id="notificationsErrorMessage">네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p><button type="button" id="notificationsRetryButton">다시 시도</button></section>
      <section id="notificationsEmpty" class="notification-state gymfit-state" hidden><strong>새로운 알림이 없어요.</strong><p>PT 숙제나 일정 소식이 생기면 여기에서 확인할 수 있어요.</p></section>
      <div id="notificationList" class="notification-list" hidden></div>
    </div>
    <div id="sideMenuContainer"></div>
    <div id="bottomNavigationContainer"></div>
  </main>
</body>
</html>
