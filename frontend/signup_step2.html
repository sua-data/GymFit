<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>GYMFIT | 회원가입 2단계</title>

  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/signup_step2.css">
  <link rel="stylesheet" href="/static/css/birth_date_input.css?v=1">
  <link rel="stylesheet" href="/static/css/agreement_modal.css?v=1">

  <script src="/static/js/agreement_modal.js?v=1" defer></script>
  <script src="/static/js/birth_date_input.js?v=2" defer></script>
  <script src="/static/js/signup_step2.js?v=4" defer></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>

<body>
  <main class="signup-step2-page">
    <section class="signup-step2-container">

      <!-- 상단 -->
      <header class="signup-header">
        <button
          type="button"
          class="back-button"
          id="backButton"
          aria-label="이전 단계"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5"></path>
            <path d="M11 18L5 12L11 6"></path>
          </svg>
        </button>

        <div class="step-progress" aria-label="회원가입 2단계">
          <div class="step-item completed">
            <span>1</span>
          </div>

          <div class="step-line">
            <div class="step-line-active"></div>
          </div>

          <div class="step-item active">
            <span>2</span>
          </div>
        </div>

        <div class="header-spacer"></div>
      </header>

      <!-- 제목 -->
      <div class="signup-title-area">
        <h1 id="pageTitle">
          회원가입
        </h1>

        <p id="pageDescription">
          운동 정보를 입력해 주세요.
        </p>
      </div>

      <form
        class="profile-form"
        id="profileForm"
        novalidate
      >

        <!-- 성별 -->
        <section class="form-section">
          <h2>성별</h2>

          <div
            class="option-row"
            role="radiogroup"
            aria-label="성별"
          >
            <button
              type="button"
              class="select-button"
              data-group="gender"
              data-value="MALE"
            >
              남성
            </button>

            <button
              type="button"
              class="select-button"
              data-group="gender"
              data-value="FEMALE"
            >
              여성
            </button>

            <button
              type="button"
              class="select-button"
              data-group="gender"
              data-value="NONE"
            >
              선택 안함
            </button>
          </div>
        </section>

        <!-- 생년월일 -->
        <section class="form-section birth-section">
          <label
            class="section-label"
            for="birthDate"
          >
            생년월일
          </label>

          <div class="date-input-wrapper">
            <input
            type="text"
            id="birthDate"
            class="date-input-display"
            name="birthDate"
            inputmode="numeric"
            maxlength="10"
            placeholder="YYYY.MM.DD"
            autocomplete="bday"
            aria-label="생년월일"
            >

            <input type="date" id="birthDatePicker" class="date-input-picker" aria-label="달력에서 생년월일 선택">
            <input type="hidden" id="birthDateValue" class="date-input-value" name="birth_date">
            <button type="button" id="birthCalendarButton" class="date-input-calendar-button" aria-label="달력 열기">
              <img src="/static/assets/icons/born_date.svg" alt="" aria-hidden="true">
            </button>

          </div>
          <p id="birthDateError" class="date-input-error" hidden></p>
        </section>

        <!-- 키 / 몸무게 -->
        <section class="body-info-grid">
          <div class="body-info-item">
            <label for="height">
              키 <span>(선택)</span>
            </label>

            <div class="number-input-wrapper">
              <input
                type="number"
                id="height"
                name="height"
                min="100"
                max="250"
                step="1"
                placeholder="186"
                inputmode="numeric"
              >

              <span class="unit">cm</span>
            </div>
          </div>

          <div class="body-info-item">
            <label for="weight">
              몸무게 <span>(선택)</span>
            </label>

            <div class="number-input-wrapper">
              <input
                type="number"
                id="weight"
                name="weight"
                min="30"
                max="300"
                step="0.1"
                placeholder="79"
                inputmode="decimal"
              >

              <span class="unit">kg</span>
            </div>
          </div>
        </section>

        <!-- 운동 목표 -->
        <section class="form-section goal-section">
          <h2>운동 목표</h2>

          <div
            class="goal-grid"
            role="radiogroup"
            aria-label="운동 목표"
          >
            <button
              type="button"
              class="goal-card"
              data-group="goal"
              data-value="WEIGHT_LOSS"
            >
              <span
                class="goal-icon goal-icon-fire"
                aria-hidden="true"
              ></span>

              <span class="goal-name">
                체중 감량
              </span>
            </button>

            <button
              type="button"
              class="goal-card"
              data-group="goal"
              data-value="MUSCLE_GAIN"
            >
              <span
                class="goal-icon goal-icon-gym"
                aria-hidden="true"
              ></span>

              <span class="goal-name">
                근력 증가
              </span>
            </button>

            <button
              type="button"
              class="goal-card"
              data-group="goal"
              data-value="BODY_SHAPE"
            >
              <span
                class="goal-icon goal-icon-body"
                aria-hidden="true"
              ></span>

              <span class="goal-name">
                체형 관리
              </span>
            </button>

            <button
              type="button"
              class="goal-card"
              data-group="goal"
              data-value="HEALTH"
            >
              <span
                class="goal-icon goal-icon-health"
                aria-hidden="true"
              ></span>

              <span class="goal-name">
                건강 관리
              </span>
            </button>
          </div>
        </section>

        <!-- 운동 수준 -->
        <section class="form-section level-section">
          <h2>운동 수준</h2>

          <div
            class="option-row"
            role="radiogroup"
            aria-label="운동 수준"
          >
            <button
              type="button"
              class="select-button"
              data-group="level"
              data-value="BEGINNER"
            >
              초급
            </button>

            <button
              type="button"
              class="select-button"
              data-group="level"
              data-value="INTERMEDIATE"
            >
              중급
            </button>

            <button
              type="button"
              class="select-button"
              data-group="level"
              data-value="ADVANCED"
            >
              고급
            </button>
          </div>
        </section>

        <section class="form-section weekly-section">
          <h2>주간 운동 횟수</h2>
          <div class="weekly-grid" role="radiogroup" aria-label="주간 운동 횟수">
            <button type="button" class="select-button" data-group="weekly" data-value="1">주 1회</button>
            <button type="button" class="select-button" data-group="weekly" data-value="2">주 2회</button>
            <button type="button" class="select-button" data-group="weekly" data-value="3">주 3회</button>
            <button type="button" class="select-button" data-group="weekly" data-value="4">주 4회</button>
            <button type="button" class="select-button" data-group="weekly" data-value="5">주 5회</button>
            <button type="button" class="select-button" data-group="weekly" data-value="6">주 6회</button>
            <button type="button" class="select-button" data-group="weekly" data-value="7">매일</button>
          </div>
        </section>

        <p
          class="form-message"
          id="formMessage"
          aria-live="polite"
        ></p>
        
        <div
          class="google-agreement-area"
          id="googleAgreementArea"
          hidden
        >
          <!-- 전체 동의 -->
          <label class="agreement-all-item">
            <input
              type="checkbox"
              id="googleAgreeAll"
            >

            <span class="custom-checkbox"></span>

            <strong>전체 동의</strong>
          </label>

          <div class="agreement-divider"></div>

          <!-- 이용약관 -->
          <div class="agreement-row">
            <label class="agreement-label">
              <input
                type="checkbox"
                id="googleTerms"
                class="google-agreement-checkbox"
              >

              <span class="custom-checkbox"></span>

              <span class="agreement-text">
                이용약관 동의
                <em>(필수)</em>
              </span>
            </label>

            <button
              type="button"
              class="agreement-view-button"
              data-agreement="terms"
            >
              보기
            </button>
          </div>

          <!-- 개인정보 -->
          <div class="agreement-row">
            <label class="agreement-label">
              <input
                type="checkbox"
                id="googlePrivacy"
                class="google-agreement-checkbox"
              >

              <span class="custom-checkbox"></span>

              <span class="agreement-text">
                개인정보 처리방침 동의
                <em>(필수)</em>
              </span>
            </label>

            <button
              type="button"
              class="agreement-view-button"
              data-agreement="privacy"
            >
              보기
            </button>
          </div>

          <!-- 마케팅 -->
          <div class="agreement-row">
            <label class="agreement-label">
              <input
                type="checkbox"
                id="googleMarketing"
                class="google-agreement-checkbox"
              >

              <span class="custom-checkbox"></span>

              <span class="agreement-text">
                마케팅 정보 수신 동의
                <em>(선택)</em>
              </span>
            </label>

            <button
              type="button"
              class="agreement-view-button"
              data-agreement="marketing"
            >
              보기
            </button>
          </div>
        </div>

        <!-- 가입 완료 -->
        <button
          type="submit"
          class="complete-button"
          id="completeButton"
        >
          가입 완료
        </button>

        <!-- 나중에 설정 -->
        <button
          type="button"
          class="skip-button"
          id="skipButton"
        >
          나중에 설정하기
        </button>

      </form>
    </section>
  </main>
</body>
</html>
