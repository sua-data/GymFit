<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        >
        <title>GYMFIT | PT 숙제</title>

        <link rel="stylesheet" href="/static/css/common.css?v=2">
        <link rel="stylesheet" href="/static/css/common_layout.css?v=4">
        <link rel="stylesheet" href="/static/css/pt_assignments.css?v=8">

        <script src="/static/js/api_client.js?v=5" defer></script>
        <script src="/static/js/common_layout.js?v=23" defer></script>
        <script src="/static/js/pt_assignments.js?v=6" defer></script>
      <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>

    <body
        data-page="pt"
        data-header-title="PT 숙제"
        data-header-subtitle="트레이너가 배정한 운동을 확인하세요"
    >
        <main class="assignment-page">
            <div class="assignment-container">
                <div id="topHeaderContainer"></div>

                <div
                    id="assignmentFilters"
                    class="assignment-filter"
                    role="tablist"
                    aria-label="PT 숙제 상태"
                >
                    <button type="button" class="active" data-status="" role="tab" aria-selected="true">전체</button>
                    <button type="button" data-status="ASSIGNED" role="tab" aria-selected="false">진행 전</button>
                    <button type="button" data-status="IN_PROGRESS" role="tab" aria-selected="false">진행 중</button>
                    <button type="button" data-status="COMPLETED" role="tab" aria-selected="false">완료</button>
                </div>

                <section
                    id="assignmentState"
                    class="assignment-state gymfit-state"
                    role="status"
                    aria-live="polite"
                >
                    숙제를 불러오는 중입니다.
                </section>

                <section
                    id="assignmentList"
                    class="assignment-list"
                    hidden
                ></section>
            </div>

            <div
                id="manualRecordOverlay"
                class="manual-record-overlay"
                hidden
            >
                <button
                    id="manualRecordBackdrop"
                    type="button"
                    aria-label="닫기"
                ></button>

                <section
                    class="manual-record-sheet"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="manualRecordTitle"
                >
                    <form
                        id="manualRecordForm"
                        class="assignment-form"
                    >
                        <h2 id="manualRecordTitle">
                            운동 기록 입력
                        </h2>

                        <p id="manualRecordExercise"></p>

                        <div class="assignment-targets">
                            <label>
                                <span>완료 세트</span>
                                <input
                                    id="manualCompletedSets"
                                    type="number"
                                    min="0"
                                    max="100"
                                    inputmode="numeric"
                                    value="0"
                                >
                            </label>

                            <label>
                                <span>총 반복</span>
                                <input
                                    id="manualRepetitions"
                                    type="number"
                                    min="0"
                                    max="10000"
                                    inputmode="numeric"
                                    value="0"
                                >
                            </label>

                            <label>
                                <span>운동 시간</span>
                                <input
                                    id="manualMinutes"
                                    type="number"
                                    min="0"
                                    max="1440"
                                    inputmode="numeric"
                                    value="0"
                                >
                            </label>
                        </div>

                        <label>
                            <span>예상 소모 칼로리</span>
                            <input
                                id="manualCalories"
                                type="number"
                                min="0"
                                max="10000"
                                inputmode="numeric"
                                placeholder="자동 계산"
                            >
                            <small>체중·MET·운동시간을 기준으로 저장할 때 계산됩니다.</small>
                        </label>

                        <label>
                            <span>회원 메모 (선택)</span>
                            <textarea
                                id="manualNote"
                                maxlength="2000"
                                placeholder="운동 느낌이나 특이사항을 입력하세요."
                            ></textarea>
                        </label>

                        <p
                            id="manualRecordError"
                            class="assignment-form-message"
                            role="alert"
                        ></p>

                        <div class="manual-record-actions">
                            <button
                                id="manualRecordCancel"
                                type="button"
                                class="secondary"
                            >
                                취소
                            </button>

                            <button
                                id="manualRecordSave"
                                type="submit"
                            >
                                운동 기록 저장
                            </button>
                        </div>
                    </form>
                </section>
            </div>

            <div id="sideMenuContainer"></div>
            <div id="bottomNavigationContainer"></div>
        </main>
    </body>
</html>
