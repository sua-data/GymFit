<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="GYMFIT 로그인 페이지"
  >

  <meta
    name="google-client-id"
    content="32113047904-tvphi3o34evgjhngj0l5il19eg88eof9.apps.googleusercontent.com"
  >

  <title>GYMFIT | 로그인</title>

  <link
    rel="stylesheet"
    href="/static/css/common.css?v=2"
  >

  <link
    rel="stylesheet"
    href="/static/css/login.css?v=2"
  >

  <script src="/static/js/api_client.js?v=5" defer></script>
  <script
    src="https://accounts.google.com/gsi/client?hl=ko"
    async
    defer
  ></script>

  <script
    src="/static/js/login.js?v=6"
    defer
  ></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>

<body>
  <main class="login-page">
    <section class="login-container">

      <!-- 브랜드 영역 -->
      <header class="login-header">
        <img
          class="gymfit-symbol"
          src="/static/assets/icons/GYMFIT-logo.svg"
          alt=""
        >

        <img
          class="gymfit-text"
          src="/static/assets/icons/GYMFIT-text.svg"
          alt="GYMFIT"
        >

        <p class="login-slogan">
          STRONGER EVERYDAY
        </p>
      </header>

      <!-- 로그인 폼 -->
      <form
        class="login-form"
        id="loginForm"
        novalidate
      >
        <!-- 이메일 -->
        <label class="login-field-label" for="email">이메일</label>
        <div class="input-group">
          <span
            class="input-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <path d="M3 7L12 13L21 7"></path>
            </svg>
          </span>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력하세요."
            autocomplete="email"
            inputmode="email"
            aria-describedby="emailError"
          >
        </div>
        <p class="field-error-message" id="emailError" role="alert"></p>

        <!-- 비밀번호 -->
        <label class="login-field-label" for="password">비밀번호</label>
        <div class="input-group">
          <span
            class="input-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect
                x="5"
                y="10"
                width="14"
                height="11"
                rx="2"
              ></rect>

              <path d="M8 10V7A4 4 0 0 1 16 7V10"></path>
            </svg>
          </span>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요."
            autocomplete="current-password"
            aria-describedby="passwordError"
          >

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="비밀번호 표시"
          >
            <img
              id="passwordIcon"
              src="/static/assets/icons/eye-off.svg"
              alt=""
            >
          </button>
        </div>
        <p class="field-error-message" id="passwordError" role="alert"></p>

        <!-- 오류 메시지 -->
        <p
          class="error-message"
          id="errorMessage"
          role="alert"
        ></p>

        <!-- 로그인 -->
        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          로그인
        </button>
      </form>

      <!-- 비밀번호 찾기 -->
      <div class="password-find">
        <span>비밀번호를 잊으셨나요?</span>

        <a href="/find-password">
          비밀번호 찾기
        </a>
      </div>

      <!-- 구분선 -->
      <div class="divider">
        <span>또는</span>
      </div>

      <!-- Google 로그인 -->
      <button
        type="button"
        class="google-button"
        id="googleLoginButton"
      >
        <img
          src="/static/assets/icons/google-logo.svg"
          alt=""
        >

        <span>Google 계정으로 로그인</span>
      </button>

      <!-- 회원가입 -->
      <div class="signup-area">
        <span>아직 회원이 아니신가요?</span>

        <a href="/signup/type">
          회원가입
        </a>
      </div>

    </section>
  </main>
</body>
</html>
