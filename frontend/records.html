<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GYMFIT | 운동 기록</title>
  <link rel="stylesheet" href="/static/css/common.css"><link rel="stylesheet" href="/static/css/common_layout.css?v=3">
  <link rel="stylesheet" href="/static/css/common_dropdown.css?v=3"><link rel="stylesheet" href="/static/css/records.css?v=3">
  <script src="/static/js/common_layout.js?v=17" defer></script><script src="/static/js/common_dropdown.js?v=2" defer></script>
  <script src="/static/js/records.js?v=5" defer></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>
<body data-page="records" data-header-title="운동 기록" data-header-subtitle="하루의 운동을 세션으로 기록하세요">
  <main class="records-page"><div class="records-container"><div id="topHeaderContainer"></div>
    <section class="records-summary"><div><span>WORKOUT HISTORY</span><h1>나의 운동 기록</h1></div><strong><b id="recordTotalCount">0</b>회</strong></section>
    <button id="openRecordForm" class="record-create-button" type="button">+ 운동 기록 추가</button>
    <nav class="record-filters" aria-label="기록 기간 필터"><button type="button" class="active" data-period="all">전체</button><button type="button" data-period="today">오늘</button><button type="button" data-period="7d">최근 7일</button><button type="button" data-period="30d">최근 30일</button></nav>
    <section class="records-state" id="recordsLoading">운동 기록을 불러오고 있습니다.</section>
    <section class="records-state" id="recordsEmpty" hidden><strong>아직 저장된 운동 기록이 없어요.</strong><p>오늘 수행한 운동을 하나의 기록으로 남겨 보세요.</p></section>
    <section class="records-state error" id="recordsError" hidden><strong>운동 기록을 불러오지 못했습니다.</strong><p id="recordsErrorMessage"></p><button type="button" id="recordsRetryButton">다시 시도</button></section>
    <section class="records-list" id="recordsList" hidden></section>
  </div>

  <div class="record-detail-overlay" id="recordDetailOverlay" hidden><button type="button" class="record-detail-backdrop" id="recordDetailBackdrop" aria-label="상세 닫기"></button>
    <section class="record-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="recordDetailTitle"><header><div class="record-detail-title-row"><h2 id="recordDetailTitle">운동 기록</h2><span id="recordDetailType" class="record-type workout">일반 운동</span></div><button type="button" id="recordDetailClose" class="sheet-icon-close" aria-label="닫기"><img src="/static/assets/icons/no.svg" alt=""></button></header>
      <div class="detail-state" id="recordDetailLoading">상세 기록을 불러오고 있습니다.</div><div class="detail-state error" id="recordDetailError" hidden><strong>상세 기록을 불러오지 못했습니다.</strong><p id="recordDetailErrorMessage"></p><button type="button" id="recordDetailRetry">다시 시도</button></div>
      <div class="record-detail-content" id="recordDetailContent" hidden></div>
    </section>
  </div>

  <div class="record-detail-overlay" id="recordFormOverlay" hidden><button type="button" class="record-detail-backdrop" id="recordFormBackdrop" aria-label="기록 닫기"></button>
    <section class="record-detail-sheet record-form-sheet" role="dialog" aria-modal="true" aria-labelledby="recordFormTitle"><header><div><span>NEW WORKOUT</span><h2 id="recordFormTitle">운동 기록 추가</h2></div><button type="button" id="recordFormClose" class="sheet-icon-close" aria-label="닫기"><img src="/static/assets/icons/no.svg" alt=""></button></header>
      <form id="recordForm" class="record-form">
        <label><span>기록 제목</span><input id="recordTitle" maxlength="150" placeholder="비워두면 자동 생성"></label>
        <div class="record-form-grid"><label><span>운동 날짜</span><input id="recordDate" type="date" required></label><label><span>운동 부위</span><select id="recordPart" data-gymfit-select><option value="">전체</option><option>상체</option><option>하체</option><option>가슴</option><option>등</option><option>어깨</option><option>팔</option><option>코어</option><option>유산소</option></select></label></div>
        <div class="record-form-grid"><label><span>시작 시간</span><input id="recordStart" type="time" required></label><label><span>종료 시간</span><input id="recordEnd" type="time" required></label></div>
        <label><span>장소</span><input id="recordLocation" maxlength="200" placeholder="선택"></label>
        <section class="record-item-editor"><div class="record-editor-heading"><strong>수행 운동</strong><button id="addRecordItem" type="button">+ 운동 추가</button></div><div id="recordItemList"></div><p>운동 상세 없이도 기록할 수 있습니다.</p></section>
        <label><span>메모</span><textarea id="recordMemo" rows="3" maxlength="5000" placeholder="오늘 운동에 대한 메모"></textarea></label>
        <p id="recordFormMessage" class="record-form-message" role="alert"></p><button id="recordSave" class="record-save-button" type="submit">기록 저장</button>
      </form>
    </section>
  </div>
  <div id="sideMenuContainer"></div><div id="bottomNavigationContainer"></div></main>
</body></html>
