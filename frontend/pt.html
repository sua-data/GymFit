<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GYMFIT | PT 연결 관리</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/common_layout.css?v=3">
  <link rel="stylesheet" href="/static/css/pt.css?v=1">
  <script src="/static/js/common_layout.js?v=13" defer></script>
  <script src="/static/js/pt.js?v=2" defer></script>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=1">
  <link rel="shortcut icon" href="/static/favicon.ico?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#000000">
</head>
<body data-page="pt" data-header-title="PT 연결 관리" data-header-subtitle="트레이너와 회원의 연결을 관리하세요">
  <main class="pt-page">
    <div class="pt-container">
      <div id="topHeaderContainer"></div>
      <section id="ptLoading" class="pt-state">PT 연결 정보를 불러오고 있습니다.</section>
      <section id="ptError" class="pt-state error" hidden><p id="ptErrorMessage"></p><button type="button" id="ptRetryButton">다시 시도</button></section>

      <div id="trainerView" hidden>
        <section class="pt-card">
          <div class="section-heading"><span>MEMBER SEARCH</span><h1>회원 연결 요청</h1></div>
          <form id="memberSearchForm" class="search-row">
            <input id="memberEmailInput" type="search" inputmode="email" autocomplete="off" placeholder="회원 이메일 검색" required minlength="2">
            <button type="submit">검색</button>
          </form>
          <p id="memberSearchMessage" class="helper">이메일 일부 또는 전체를 입력하세요.</p>
          <div id="memberSearchResults" class="pt-list"></div>
        </section>
        <section class="pt-card"><div class="section-heading"><span>PENDING</span><h2>보낸 요청</h2></div><div id="sentRequestList" class="pt-list"></div></section>
        <section class="pt-card"><div class="section-heading"><span>ACTIVE</span><h2>담당 회원</h2></div><div id="activeMemberList" class="pt-list"></div></section>
      </div>

      <div id="memberView" hidden>
        <section class="pt-card"><div class="section-heading"><span>MY TRAINER</span><h1>현재 담당 트레이너</h1></div><div id="myTrainerCard" class="pt-list"></div></section>
        <section class="pt-card"><div class="section-heading"><span>REQUESTS</span><h2>받은 PT 요청</h2></div><div id="receivedRequestList" class="pt-list"></div></section>
      </div>
    </div>
    <div id="sideMenuContainer"></div>
    <div id="bottomNavigationContainer"></div>
  </main>
</body>
</html>
