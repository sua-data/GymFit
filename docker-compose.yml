services:
  mariadb:
    image: mariadb:11.4
    container_name: gymfit-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-1111}
      MARIADB_DATABASE: ${DB_NAME:-gymfit}
      MARIADB_USER: ${DB_USER:-gymfit}
      MARIADB_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "3307:3306"
    volumes:
      - gymfit_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymfit-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

volumes:
  gymfit_db_data: